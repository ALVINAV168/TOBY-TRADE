/* Compact terminal layout: keep chart, order controls and positions on one viewport */
.terminal{height:100dvh;grid-template-rows:50px minmax(0,1fr) 23px}
.terminal-body{grid-template-columns:44px minmax(0,1fr) 310px}
.order-panel-head{padding:7px 11px;min-height:38px}
.order-panel-body{padding:7px 10px;overflow:hidden;display:flex;flex-direction:column;gap:5px}
.trade-switch{padding:2px;flex:0 0 auto}.trade-switch button{padding:6px 8px}
.terminal-stat{padding:4px 0;font-size:10px;line-height:1.2}
.terminal-order{margin-top:2px;display:grid;grid-template-columns:1fr 1fr;column-gap:9px;row-gap:1px;align-items:end}
.terminal-order>label{margin-top:4px;font-size:10px;min-width:0}
.terminal-order .input{margin-top:3px!important;padding:6px 8px;height:30px;border-radius:8px;font-size:12px}
.terminal-order> .terminal-stat{margin:0;min-height:25px}
.terminal-order> .terminal-actions{display:none}
.terminal-trade-row{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:6px;margin-top:6px;align-items:center}
.terminal-trade-row .btn{padding:7px 5px;font-size:11px;white-space:nowrap}
.terminal-trade-row .terminal-main-trade{font-weight:850;letter-spacing:.04em;min-height:34px;font-size:13px}
.terminal-metrics{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.terminal-advanced{grid-column:1/-1;padding:5px 8px;font-size:10px;margin-top:2px;justify-self:end}
#terminalPositions{margin-top:2px!important;overflow:hidden;font-size:10px;line-height:1.25}
#terminalPositions>div{padding:5px 7px!important;margin-bottom:4px!important}
.chart-toolbar{height:38px;min-height:38px}.chart-legend{padding:4px 8px;gap:8px;font-size:9px}
.chart-zoom-controls{margin-left:auto;display:flex;gap:2px;align-items:center}.chart-zoom-controls .tf{padding:5px 8px}
.terminal-footer{font-size:9px}

function resetApiConsent(section){apiConsent[section]=undefined;localStorage.setItem(API_CONSENT_KEY,JSON.stringify(apiConsent));apiAttempted[section]=false;attemptMarketAPI(section,true);renderContent()}
function useDefaultMarket(section){const list=section==='crypto'?COINS:section==='forex'?FOREX:STOCKS;for(const a of list){const r=state.ranges[a.id]||{min:a.min,max:a.max};prices[a.id]=(r.min+r.max)/2;changes[a.id]=0;histories[a.id]=histories[a.id]||Array.from({length:28},()=>prices[a.id]*(.96+Math.random()*.08))}if(section==='crypto')priceMode='default';refreshLiveUI()}
async function runMarketAPI(section){if(section==='crypto')return await fetchLivePrices();if(section==='forex')return (await fetchForexPrices())>=20;if(section==='stocks')return (await fetchStockPrices())>=5;return false}
async function attemptMarketAPI(section,force=false){if(apiRetrying===section)return;apiRetrying=section;apiAttempted[section]=true;document.getElementById('apiConsentModal')?.remove();setPriceStatus('connecting','Connecting '+section+'...');let ok=false;try{ok=await runMarketAPI(section)}catch(e){console.warn(section+' API failed',e)}apiRetrying=null;if(ok){apiConsent[section]=true;localStorage.setItem(API_CONSENT_KEY,JSON.stringify(apiConsent));toast(API_LABELS[section]+' connected');return true}showApiFailure(section);return false}
function showApiFailure(section){if(apiFailureQueue.includes(section)||document.getElementById('apiConsentModal')){if(!apiFailureQueue.includes(section))apiFailureQueue.push(section);return}const el=document.createElement('div');el.id='apiConsentModal';el.className='modal-backdrop';el.innerHTML=`<div class="modal"><div class="modal-head"><h2>Could not connect to ${API_LABELS[section]}</h2></div><p class="muted">The automatic connection attempt failed. What would you like TOBY TRADE to do for this market?</p><div class="terminal-actions"><button class="btn" onclick="retryFailedAPI('${section}')">Try again</button><button class="btn primary" onclick="chooseDefaultAPI('${section}')">Use default prices</button></div></div>`;document.body.appendChild(el)}
function nextAPIFailure(){let next=apiFailureQueue.shift();if(next)showApiFailure(next)}
async function retryFailedAPI(section){document.getElementById('apiConsentModal')?.remove();let ok=await attemptMarketAPI(section,true);if(ok)nextAPIFailure()}
function chooseDefaultAPI(section){document.getElementById('apiConsentModal')?.remove();apiConsent[section]=false;localStorage.setItem(API_CONSENT_KEY,JSON.stringify(apiConsent));useDefaultMarket(section);nextAPIFailure()}
async function startMarketAPIAttempts(){for(const k of ['crypto','forex','stocks']){if(apiConsent[k]!==false){let ok=await attemptMarketAPI(k);if(!ok)await new Promise(resolve=>{let check=()=>{if(!document.getElementById('apiConsentModal')&&!apiFailureQueue.length)resolve();else setTimeout(check,250)};check()})}}}
function refreshLiveUI(){if(!current)return;let u=user();let top=document.getElementById('topBalance');if(top)top.textContent=usd(state.balances[u.id]||0);document.querySelectorAll('[data-live-price]').forEach(el=>{let id=el.dataset.livePrice;if(prices[id]!=null)el.textContent=usd(prices[id])});document.querySelectorAll('[data-live-change]').forEach(el=>{let id=el.dataset.liveChange,ch=changes[id]||0;el.textContent=(ch>=0?'+':'')+ch.toFixed(2)+'%';el.className='change '+(ch>=0?'up':'down')});document.querySelectorAll('[data-live-owned]').forEach(el=>{let id=el.dataset.liveOwned;el.textContent=money((state.holdings[u.id]||{})[id]?.amount||0)+' owned'});drawAllCharts()}
function tick(){if(priceMode==='live'){return fetchLivePrices()}if(priceMode==='default'){ALL_ASSETS.forEach(c=>{let r=state.ranges[c.id]||{min:c.min,max:c.max};let p=prices[c.id]||((r.min+r.max)/2);let next=Math.min(r.max,Math.max(r.min,p*(1+(Math.random()-.49)*.012)));changes[c.id]=(next-p)/p*100;prices[c.id]=next;histories[c.id].push(next);if(histories[c.id].length>240)histories[c.id].shift()});refreshLiveUI();monitorPositions()}}
function portfolio(){let u=user();if(!u)return 0;return Object.entries(state.holdings[u.id]||{}).reduce((s,[id,h])=>s+h.amount*prices[id],0)}
function navItems(){let a=[['dashboard',ICONS.grid,'Dashboard'],['markets',ICONS.market,'Markets'],['chartlab',ICONS.market,'Chart Lab'],['wallet',ICONS.wallet,'Wallet'],['orders',ICONS.orders,'Orders'],['journal',ICONS.orders,'Trade Journal'],['analytics',ICONS.market,'Analytics'],['news',ICONS.news,'News'],['settings',ICONS.settings,'Settings']];if(user()?.role==='admin')a.push(['admin',ICONS.shield,'Admin']);return a}
function navHTML(){return navItems().map(([id,ic,t])=>`<button class="${active===id?'active':''}" onclick="go('${id}')"><span class="nav-icon">${ic}</span>${t}</button>`).join('')}
function renderShell(){document.getElementById('sideNav').innerHTML=navHTML();document.getElementById('drawerNav').innerHTML=navHTML();document.getElementById('topBalance').textContent=usd(state.balances[user().id]||0);setPriceStatus(priceMode,priceMode==='live'?'Live prices':priceMode==='default'?'Default prices':'Connecting...')}
function go(v){active=v;document.body.classList.remove('terminal-mode');closeDrawer();renderShell();document.getElementById('pageTitle').textContent=navItems().find(x=>x[0]===v)?.[2]||'TOBY TRADE';renderContent(true);window.scrollTo({top:0,behavior:'smooth'})}
function renderContent(redraw=true){let el=document.getElementById('content');let html=active==='dashboard'?dashboard():active==='markets'?markets():active==='chartlab'?chartLab():active==='wallet'?wallet():active==='orders'?orders():active==='journal'?tradeJournal():active==='analytics'?analytics():active==='news'?news():active==='settings'?settings():active==='terminal'?terminal():active==='detail'?detail():admin();el.innerHTML=html;setTimeout(()=>{drawAllCharts();if(active==='terminal'){bindChartInteractions();loadTerminalCandles()}},0)}
function dashboard(){let u=user(),bal=state.balances[u.id]||0,pv=portfolio(),pos=Object.values(state.holdings[u.id]||{}).filter(x=>x.amount>0).length;return `<div class="demo">Demo simulation is active — prices move every few seconds and no real trades are executed.</div><section class="hero"><div class="hero-card"><div class="muted">TOBY TRADE</div><h1>Trade with clarity.</h1><p>A minimal dashboard for market practice, portfolio management, and testing buy/sell strategies. Everything is stored locally in your browser.</p><div class="hero-actions"><button class="btn primary" onclick="go('markets')">View markets</button><button class="btn" onclick="openDeposit()">+ Demo funds</button></div></div><div class="stats"><div class="stat"><small>Cash balance</small><strong class="num">${irr(bal)}</strong></div><div class="stat"><small>Asset value</small><strong class="num">${irr(pv)}</strong></div><div class="stat"><small>Open positions</small><strong class="num">${pos}</strong></div></div></section><div class="section-head"><h2>Popular markets</h2><div><button class="btn" onclick="go('chartlab')">Open Chart Lab</button> <button class="btn" onclick="go('markets')">All markets</button></div></div><div class="grid">${COINS.slice(0,8).map(card).join('')}</div>`}

function marketTabs(){return [['crypto','Crypto · 30'],['forex','Forex · 30'],['stocks','Stocks · 40']].map(([k,t])=>`<button class="btn ${activeMarket===k?'primary':''}" onclick="setMarket('${k}')">${t}</button>`).join('')}

function priceSourceLabel(c){if(c.market==='crypto')return apiConsent.crypto?'Binance API / fallback':'Demo price';if(c.market==='forex')return apiConsent.forex?'Daily reference API / fallback':'Demo price';return apiConsent.stocks?'Yahoo Finance where available / fallback':'Demo price'}

function terminal(){let c=coin(selectedCoin),p=prices[c.id]||0,ch=changes[c.id]||0,u=user(),h=(state.holdings[u.id]||{})[c.id],owned=h?.amount||0;return `<div class="terminal"><div class="terminal-head"><div class="terminal-left"><button class="icon-btn terminal-icon" onclick="exitTerminal()" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18 9 12l6-6"/></svg></button><div><div class="terminal-symbol">${c.symbol}</div><div class="terminal-market">${c.name} · ${c.market==='forex'?'Forex':c.market==='stocks'?'Stocks':'Crypto'} · ${priceMode==='live'?'Live Market':'Demo / API'}</div></div><div class="terminal-price num">$${money(p)}</div><div class="${ch>=0?'up':'down'} terminal-market">${ch>=0?'+':''}${ch.toFixed(2)}%</div></div><div class="terminal-right"><button class="btn terminal-btn" onclick="openDeposit()">Add funds</button><button class="icon-btn terminal-icon" onclick="toggleTheme()" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></div><div class="terminal-body"><aside class="terminal-tools"><button class="tool-btn active" data-tool="crosshair" title="Crosshair" onclick="setChartTool('crosshair',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button><button class="tool-btn" data-tool="trendline" title="Trend line" onclick="setChartTool('trendline',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19 19 5"/></svg></button><button class="tool-btn" data-tool="measure" title="Measure" onclick="setChartTool('measure',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 17 17 4M7 4l13 13"/></svg></button><button class="tool-btn" data-tool="horizontal" title="Horizontal line" onclick="setChartTool('horizontal',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h18M7 8v8M17 8v8"/></svg></button><button class="tool-btn" data-tool="pan" title="Pan chart" onclick="setChartTool('pan',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 12V5a2 2 0 0 1 4 0v6-8a2 2 0 0 1 4 0v9-6a2 2 0 0 1 4 0v9c0 4-3 7-7 7h-1c-2 0-4-1-5-3l-3-4a2 2 0 0 1 3-3l2 2"/></svg></button></aside><section class="chart-stage"><div class="chart-toolbar">${["1m","5m","15m","30m","1H","4H","1D","1W"].map(tf=>`<button class="tf ${terminalChartState.tf===tf?'active':''}" onclick="setChartTF('${tf}')">${tf}</button>`).join('')}<span style="width:1px;height:20px;background:var(--border);margin:0 5px"></span><button class="tf ${terminalChartState.type==='candles'?'active':''}" onclick="setChartType('candles')">Candles</button><button class="tf ${terminalChartState.type==='line'?'active':''}" onclick="setChartType('line')">Line</button><span class="chart-zoom-controls"><button class="tf" onclick="setChartZoom(-1)" title="Zoom out">−</button><button class="tf" onclick="setChartZoom(1)" title="Zoom in">+</button><button class="tf" onclick="resetChartView()" title="Reset chart">Reset</button></span></div><div class="mobile-chart-tools"><button class="tool-btn active" data-tool="crosshair" title="Crosshair" onclick="setChartTool('crosshair',this)">＋</button><button class="tool-btn" data-tool="trendline" title="Trend line" onclick="setChartTool('trendline',this)">╱</button><button class="tool-btn" data-tool="measure" title="Measure" onclick="setChartTool('measure',this)">↗</button><button class="tool-btn" data-tool="horizontal" title="Horizontal line" onclick="setChartTool('horizontal',this)">―</button><button class="tool-btn" data-tool="pan" title="Pan chart" onclick="setChartTool('pan',this)">✋</button></div><div class="chart-legend"><span><i class="bull"></i>Bullish</span><span><i class="bear"></i>Bearish</span><span>Drag SL / TP lines to adjust</span><span>${terminalChartState.loading?'Loading OHLC…':terminalChartState.remoteCandles?'Historical OHLC':'Demo sample candles'}</span><span style="margin-left:auto">${c.symbol} · ${terminalChartState.tf}</span></div><div class="chart-wrap" id="terminalChartWrap"><canvas id="terminalChart" class="terminal-chart"></canvas><div class="chart-overlay"><span class="chart-label">${c.symbol} · ${terminalChartState.type==='candles'?'Candlestick':'Line'}</span></div><div class="chart-hint">Crosshair · Price scale · Drag levels</div></div></section><aside class="order-panel"><div class="order-panel-head"><div><b>Order</b><div class="terminal-market">${c.symbol}/USD</div></div><span class="terminal-market">Market</span></div><div class="order-panel-body"><div class="trade-switch"><button class="${tradeSide==='buy'?'active buy':''}" onclick="setTerminalSide('buy')">Buy</button><button class="${tradeSide==='sell'?'active sell':''}" onclick="setTerminalSide('sell')">Sell</button></div><div class="terminal-stat"><span>Available balance</span><b class="num">${irr(state.balances[u.id]||0)}</b></div><div class="terminal-stat"><span>Position</span><b class="num">${money(owned)} ${c.symbol}</b></div><div class="terminal-stat"><span>Unrealized P&amp;L</span><b class="num ${h&&owned>0?((p-h.avg)*owned>=0?'up':'down'):''}">${h&&owned>0?((p-h.avg)*owned>=0?'+':'')+money((p-h.avg)*owned):'$0.00'}</b></div><div class="terminal-stat"><span>P&amp;L %</span><b class="num ${h&&owned>0?((p-h.avg)>=0?'up':'down'):''}">${h&&owned>0?((p-h.avg)>=0?'+':'')+(((p-h.avg)/h.avg)*100).toFixed(2)+'%':'0.00%'}</b></div><div class="terminal-stat"><span>Entry price</span><b class="num">${h&&owned>0?'$'+money(h.avg):'$0.00'}</b></div><div class="terminal-stat"><span>Market price</span><b class="num">$${money(p)}</b></div><div class="terminal-order"><label>${c.market==='forex'?'Volume (lots)':c.market==='stocks'?'Volume (shares)':'Volume (units)'}<input class="input" id="terminalAmount" type="number" min="0" step="${c.market==='forex'?'0.01':'any'}" placeholder="${c.market==='forex'?'0.01':'0'}" oninput="calcTerminalOrder()"></label><label>Leverage (1:${marketMaxLeverage(c)})<select class="input" id="terminalLeverage" onchange="calcTerminalOrder()">${leverageOptions(c).map(v=>`<option value="${v}" ${v===defaultLeverage(c)?'selected':''}>1:${v}</option>`).join('')}</select></label><div class="terminal-stat"><span>Contract size</span><b>${contractDescription(c)}</b></div><label>Stop Loss · chart draggable<input class="input" id="terminalSL" type="number" min="0" step="any" placeholder="Price" value="${terminalChartState.sl||''}" oninput="terminalChartState.sl=+this.value||0;drawAllCharts()"></label><label>Take Profit · chart draggable<input class="input" id="terminalTP" type="number" min="0" step="any" placeholder="Price" value="${terminalChartState.tp||''}" oninput="terminalChartState.tp=+this.value||0;drawAllCharts()"></label><div class="terminal-trade-row"><button class="btn" onclick="armChartLevel('sl')">Set SL</button><button class="btn ${tradeSide==='buy'?'primary':'danger'} terminal-main-trade" onclick="executeTerminalTrade()">${tradeSide==='buy'?'BUY':'SELL'} ${c.symbol}</button><button class="btn" onclick="armChartLevel('tp')">Set TP</button></div><div class="terminal-metrics"><div class="terminal-stat"><span>Estimated notional</span><b id="terminalTotal" class="num">$0</b></div><div class="terminal-stat"><span>Required margin</span><b id="terminalMargin" class="num">$0</b></div></div><div class="pro-order-box"><div class="pro-order-title">Advanced execution</div><label>Order type<select class="input" id="pendingType"><option value="buy-limit">Buy Limit</option><option value="sell-limit">Sell Limit</option><option value="buy-stop">Buy Stop</option><option value="sell-stop">Sell Stop</option></select></label><label>Entry price<input class="input" id="pendingPrice" type="number" step="any" placeholder="Trigger price"></label><button class="btn block" onclick="placePendingOrder()">Place pending order</button><div class="pro-order-title" style="margin-top:12px">Risk calculator</div><div class="risk-row"><label>Risk %<input class="input" id="riskPercent" type="number" min="0.1" max="10" step="0.1" value="1"></label><button class="btn" onclick="calculateRiskSize()">Calculate volume</button></div><div id="riskResult" class="muted" style="font-size:11px;margin-top:6px">Enter SL and risk percentage to calculate suggested volume.</div><label>Trailing stop distance<input class="input" id="trailingDistance" type="number" min="0" step="any" placeholder="Price distance (optional)"></label></div><button class="btn terminal-advanced" onclick="openTrade('${c.id}','${tradeSide}')">Advanced order</button></div><div style="margin-top:18px" class="terminal-market">Practice positions · simulated execution only.</div><div id="terminalPositions" style="margin-top:12px">${renderTerminalPositions()}</div><div class="pro-order-title" style="margin-top:14px">Pending orders</div><div id="pendingOrderList">${renderPendingOrders()}</div></div></aside></div><div class="terminal-footer"><span class="terminal-back" onclick="exitTerminal()">Back to markets</span><span>Market</span><span>USD</span><span>Simulated data</span><span style="margin-left:auto">TOBY TRADE</span></div></div>`}
function exitTerminal(){active='markets';document.body.classList.remove('terminal-mode');renderShell();document.getElementById('pageTitle').textContent='Markets';renderContent();}
function setTerminalSide(side){tradeSide=side;renderContent();}
function calcTerminalOrder(){let a=+document.getElementById('terminalAmount')?.value||0,p=prices[selectedCoin]||0,c=coin(selectedCoin),lev=+document.getElementById('terminalLeverage')?.value||defaultLeverage(c),notional=instrumentNotional(c,a,p),margin=notional/lev;let e=document.getElementById('terminalTotal'),m=document.getElementById('terminalMargin');if(e)e.textContent=(c.currency==='IRR'?'IRR ':'$')+money(notional);if(m)m.textContent=(c.currency==='IRR'?'IRR ':'$')+money(margin)}
function renderTerminalPositions(){let u=user(),arr=(state.positions||[]).filter(x=>x.userId===u.id&&x.status==='open');if(!arr.length)return '<div class="muted" style="font-size:12px;padding:10px 0">No open positions</div>';return arr.map(x=>{let p=prices[x.assetId]||x.entry,pl=instrumentPnl(x,p);return `<div class="terminal-stat" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b class="${x.side==='buy'?'up':'down'}">${x.side.toUpperCase()} ${coin(x.assetId).symbol}</b><button class="btn danger" onclick="closePosition('${x.id}')">Close</button></div><div class="muted">Entry ${money(x.entry)} · Size ${money(x.amount)} · 1:${x.leverage||1} · Margin ${money(x.margin||0)} · P/L <b class="${pl>=0?'up':'down'}">${pl>=0?'+':''}${money(pl)}</b></div><div class="muted">SL ${x.sl||'—'} · TP ${x.tp||'—'}</div></div>`}).join('')}
function executeTerminalTrade(){let a=+document.getElementById('terminalAmount')?.value||0;if(!(a>0))return toast('Enter a valid volume',true);let id=selectedCoin,c=coin(id),p=prices[id],u=user(),lev=+document.getElementById('terminalLeverage')?.value||defaultLeverage(c),notional=instrumentNotional(c,a,p),margin=notional/lev,sl=+document.getElementById('terminalSL')?.value||0,tp=+document.getElementById('terminalTP')?.value||0;if(c.market==='forex'&&a<.01)return toast('Minimum Forex volume is 0.01 lot',true);if(lev<1||lev>marketMaxLeverage(c))return toast('Leverage exceeds the demo instrument limit',true);if(!Number.isFinite(p)||p<=0)return toast('Price unavailable',true);if(sl&&((tradeSide==='buy'&&sl>=p)||(tradeSide==='sell'&&sl<=p)))return toast('Stop Loss is on the wrong side of entry',true);if(tp&&((tradeSide==='buy'&&tp<=p)||(tradeSide==='sell'&&tp>=p)))return toast('Take Profit is on the wrong side of entry',true);if((state.balances[u.id]||0)<margin)return toast('Insufficient demo balance for required margin',true);state.balances[u.id]-=margin;state.positions=state.positions||[];let pos={id:'pos_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),userId:u.id,assetId:id,side:tradeSide,amount:a,entry:p,sl,tp,leverage:lev,notional,margin,trailingDistance:+document.getElementById('trailingDistance')?.value||0,status:'open',openedAt:Date.now()};state.positions.push(pos);state.orders.push({time:Date.now(),userId:u.id,username:u.username,side:tradeSide,coinId:id,amount:a,price:p,total:notional,margin,leverage:lev,positionId:pos.id});save();toast(`${tradeSide==='buy'?'Long':'Short'} position opened · 1:${lev}`);renderShell();renderContent();}
function closePosition(id,reason='manual'){let pos=(state.positions||[]).find(x=>x.id===id&&x.status==='open');if(!pos)return;let p=prices[pos.assetId]||pos.entry,pl=instrumentPnl(pos,p);pos.status='closed';pos.closedAt=Date.now();pos.closePrice=p;pos.pnl=pl;pos.closeReason=reason;state.balances[pos.userId]=(state.balances[pos.userId]||0)+pos.margin+pl;state.orders.push({time:Date.now(),userId:pos.userId,username:state.users.find(u=>u.id===pos.userId)?.username||'',side:'close-'+pos.side,coinId:pos.assetId,amount:pos.amount,price:p,total:pos.margin+pl,positionId:id});save();toast('Position closed · P/L '+(pl>=0?'+':'')+money(pl));if(active==='terminal')renderContent();else refreshLiveUI()}
function monitorPositions(){
 for(const p of (state.positions||[]).filter(x=>x.status==='open')){let v=prices[p.assetId];if(!Number.isFinite(v))continue;
  if(p.trailingDistance>0){if(p.side==='buy'){let next=v-p.trailingDistance;if(!p.sl||next>p.sl)p.sl=next}else{let next=v+p.trailingDistance;if(!p.sl||next<p.sl)p.sl=next}}
  if(p.sl&&((p.side==='buy'&&v<=p.sl)||(p.side==='sell'&&v>=p.sl)))closePosition(p.id,'stop-loss');else if(p.tp&&((p.side==='buy'&&v>=p.tp)||(p.side==='sell'&&v<=p.tp)))closePosition(p.id,'take-profit');
 }
 monitorPendingOrders();save();
 if(active==='terminal'){let a=document.getElementById('terminalPositions'),b=document.getElementById('pendingOrderList');if(a)a.innerHTML=renderTerminalPositions();if(b)b.innerHTML=renderPendingOrders()}
}

function cancelPendingOrder(id){let o=(state.pendingOrders||[]).find(x=>x.id===id&&x.userId===user().id&&x.status==='pending');if(!o)return;o.status='cancelled';o.cancelledAt=Date.now();save();renderContent();toast('Pending order cancelled')}
function monitorPendingOrders(){for(const o of (state.pendingOrders||[]).filter(x=>x.status==='pending')){let p=prices[o.assetId];if(!Number.isFinite(p))continue;let hit=o.type==='buy-limit'?p<=o.entry:o.type==='buy-stop'?p>=o.entry:o.type==='sell-limit'?p>=o.entry:p<=o.entry;if(!hit)continue;let c=coin(o.assetId),notional=instrumentNotional(c,o.amount,p),margin=notional/o.leverage;if((state.balances[o.userId]||0)<margin){o.status='rejected';o.reason='insufficient-margin';continue}state.balances[o.userId]-=margin;let pos={id:'pos_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),userId:o.userId,assetId:o.assetId,side:o.side,amount:o.amount,entry:p,sl:o.sl,tp:o.tp,leverage:o.leverage,notional,margin,status:'open',openedAt:Date.now(),sourcePendingOrder:o.id};state.positions.push(pos);state.orders.push({time:Date.now(),userId:o.userId,username:state.users.find(x=>x.id===o.userId)?.username||'',side:o.side,coinId:o.assetId,amount:o.amount,price:p,total:notional,margin,leverage,positionId:pos.id,orderType:o.type});o.status='filled';o.filledAt=Date.now()}}
function calculateRiskSize(){let c=coin(selectedCoin),u=user(),risk=+document.getElementById('riskPercent')?.value||1,sl=+document.getElementById('terminalSL')?.value||0,p=prices[selectedCoin],distance=Math.abs(p-sl),balance=state.balances[u.id]||0;if(!(sl>0&&distance>0&&risk>0&&risk<=10)){toast('Set a valid Stop Loss and risk between 0.1% and 10%',true);return}let riskCash=balance*risk/100,perUnit=distance*tradeQuantity(c,1),volume=riskCash/perUnit;if(c.market==='forex')volume=Math.floor(volume*100)/100;else volume=+volume.toFixed(6);let el=document.getElementById('riskResult');if(el)el.innerHTML=`Suggested volume: <b>${money(volume)} ${c.market==='forex'?'lots':c.market==='stocks'?'shares':'units'}</b><br>Planned risk: ${money(riskCash)} (${risk}% of balance)`;let amount=document.getElementById('terminalAmount');if(amount&&volume>0)amount.value=volume;calcTerminalOrder()}
function tradeJournal(){let u=user(),rows=(state.positions||[]).filter(p=>p.userId===u.id&&p.status==='closed').sort((a,b)=>(b.closedAt||0)-(a.closedAt||0));let total=rows.reduce((a,p)=>a+(p.pnl||0),0),wins=rows.filter(p=>(p.pnl||0)>0).length;return `<div class="demo">Your personal trading journal is built from closed demo positions. Add notes to capture the setup and lessons from each trade.</div><div class="stats"><div class="stat"><small>Closed trades</small><strong>${rows.length}</strong></div><div class="stat"><small>Win rate</small><strong>${rows.length?(wins/rows.length*100).toFixed(1):'0.0'}%</strong></div><div class="stat"><small>Net P/L</small><strong class="num ${total>=0?'up':'down'}">${total>=0?'+':''}${money(total)}</strong></div></div><div class="panel" style="margin-top:16px"><div class="section-head" style="margin-top:0"><h2>Trade journal</h2><button class="btn" onclick="exportTradeCSV()">Export CSV</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Closed</th><th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>Reason</th><th>P/L</th><th>Notes</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${new Date(p.closedAt||p.openedAt).toLocaleString()}</td><td>${coin(p.assetId).symbol}</td><td>${p.side.toUpperCase()}</td><td>${money(p.entry)}</td><td>${money(p.closePrice||0)}</td><td>${p.closeReason||'—'}</td><td class="${(p.pnl||0)>=0?'up':'down'}">${money(p.pnl||0)}</td><td><button class="btn" onclick="editTradeNote('${p.id}')">${p.note?'Edit note':'Add note'}</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Closed trades will appear here.</td></tr>'}</tbody></table></div></div>`}

function analytics(){let u=user(),rows=(state.positions||[]).filter(p=>p.userId===u.id&&p.status==='closed'),wins=rows.filter(p=>(p.pnl||0)>0),losses=rows.filter(p=>(p.pnl||0)<0),net=rows.reduce((a,p)=>a+(p.pnl||0),0),grossWin=wins.reduce((a,p)=>a+p.pnl,0),grossLoss=Math.abs(losses.reduce((a,p)=>a+p.pnl,0)),avgWin=wins.length?grossWin/wins.length:0,avgLoss=losses.length?grossLoss/losses.length:0,series=(histories[selectedCoin]||[]).slice(-100),ema=(arr,n)=>{if(!arr.length)return 0;let k=2/(n+1),v=arr[0];for(let x of arr.slice(1))v=x*k+v*(1-k);return v},rsi=(()=>{if(series.length<15)return 0;let g=0,l=0;for(let i=series.length-14;i<series.length;i++){let d=series[i]-series[i-1];if(d>0)g+=d;else l-=d}return l===0?100:100-100/(1+g/14/(l/14||1e-9))})();return `<div class="demo">Performance statistics are calculated from your closed simulated positions. Technical readings use the currently selected symbol's available price history.</div><div class="stats"><div class="stat"><small>Net profit</small><strong class="num ${net>=0?'up':'down'}">${net>=0?'+':''}${money(net)}</strong></div><div class="stat"><small>Win rate</small><strong>${rows.length?(wins.length/rows.length*100).toFixed(1):'0.0'}%</strong></div><div class="stat"><small>Profit factor</small><strong>${grossLoss? (grossWin/grossLoss).toFixed(2):grossWin?'∞':'0.00'}</strong></div><div class="stat"><small>Average winner</small><strong class="num">${money(avgWin)}</strong></div><div class="stat"><small>Average loser</small><strong class="num">${money(avgLoss)}</strong></div><div class="stat"><small>Closed trades</small><strong>${rows.length}</strong></div></div><div class="panel" style="margin-top:16px"><div class="section-head" style="margin-top:0"><h2>Technical snapshot</h2><select class="input" style="max-width:220px" onchange="selectedCoin=this.value;renderContent()">${ALL_ASSETS.map(c=>`<option value="${c.id}" ${c.id===selectedCoin?'selected':''}>${c.symbol}</option>`).join('')}</select></div><div class="stats" function openTrade(id,side){selectedCoin=id;tradeSide=side;let c=coin(id),p=prices[id],h=(state.holdings[user().id]||{})[id];modal(`<h2>${side==='buy'?'Buy':'Sell'} ${c.symbol}</h2><p class="muted">Current price: <b class="num">$${money(p)}</b></p><div class="form"><label>Amount ${c.symbol}<input class="input" id="tradeAmount" type="number" min="0" step="any" placeholder="0" oninput="calcTrade()"></label><div class="info-row"><span>Available ${side==='buy'?'Balance':'Holdings'}</span><b class="num">${side==='buy'?irr(state.balances[user().id]||0):money(h?.amount||0)+' '+c.symbol}</b></div><div class="info-row"><span>Order value</span><b id="tradeTotal" class="num">$0.00</b></div><button class="btn ${side==='buy'?'primary':'danger'} block" onclick="executeTrade()">Confirm ${side==='buy'?'Buy':'Sell'}</button></div>`)}
function calcTrade(){let a=+document.getElementById('tradeAmount').value||0;document.getElementById('tradeTotal').textContent=irr(a*prices[selectedCoin])}
function executeTrade(){let u=user(),id=selectedCoin,c=coin(id),p=prices[id],a=+document.getElementById('tradeAmount').value||0;if(!(a>0))return toast('Enter an amount',true);let total=a*p;let h=state.holdings[u.id]||{};state.holdings[u.id]=h;if(tradeSide==='buy'){if((state.balances[u.id]||0)<total)return toast('Insufficient balance',true);state.balances[u.id]-=total;let old=h[id]||{amount:0,avg:0};old.avg=(old.amount*old.avg+total)/(old.amount+a);old.amount+=a;h[id]=old}else{let old=h[id];if(!old||old.amount<a)return toast('Insufficient holdings',true);old.amount-=a;if(old.amount<=1e-12)delete h[id];state.balances[u.id]=(state.balances[u.id]||0)+total}state.orders.push({time:Date.now(),userId:u.id,username:u.username,side:tradeSide,coinId:id,amount:a,price:p,total});state.transactions.push({time:Date.now(),userId:u.id,type:tradeSide,coinId:id,amount:a,total});save();closeModal();toast(`${tradeSide==='buy'?'Buy':'Sell'} ${c.symbol} completed`);renderShell();renderContent()}

async function verifyAccessKey(key){return String(key||'').trim()==='ALIREZA0101'}
function lockGate(){sessionStorage.removeItem('toby_gate_unlocked');localStorage.removeItem('toby_gate_verified');current=null;localStorage.removeItem('toby_current_user');active='dashboard';auth()}
function showAccessGate(){document.getElementById('auth').innerHTML=`<div class="auth-card"><div class="brand">TOBY <span>TRADE</span></div><h1>Secure access.</h1><p>This deployment is protected by a private access key. The administrator setup is locked until the key is verified.</p><div class="form"><input class="input" id="accessKey" type="password" autocomplete="off" placeholder="Private access key" onkeydown="if(event.key==='Enter')unlockGate()"><button class="btn primary block" onclick="unlockGate()">Unlock deployment</button></div><p style="font-size:12px;margin-top:20px">The key is verified locally and is never saved in browser storage or displayed.</p></div>`}

function seedFixedAdmin(){let idx=state.users.findIndex(u=>u.username==='ALIREZA');if(idx<0){state.users.push({...FIXED_ADMIN});state.balances[FIXED_ADMIN.id]??=100;state.holdings[FIXED_ADMIN.id]??={};save()}else{let u=state.users[idx];u.id=FIXED_ADMIN.id;u.fullname='ALIREZA';u.username='ALIREZA';u.role='admin';u.passwordHash=FIXED_ADMIN.passwordHash;state.balances[u.id]??=100;state.holdings[u.id]??={};save()}}
function auth(){
  if(!gateUnlocked()){document.getElementById('auth').style.display='grid';document.getElementById('app').style.display='none';showAccessGate();return}
  let activeUser=user();
  if(current&&activeUser){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';renderShell();renderContent();showApiConsentQueue();if(!window._marketAPIsStarted){window._marketAPIsStarted=true;startMarketAPIAttempts()}}

}

async function createAdmin(){if(!gateUnlocked())return showAccessGate();if(hasAdmin())return auth();let fullname=document.getElementById('adminName').value.trim(),username=document.getElementById('adminUser').value.trim(),email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPass').value,confirmPassword=document.getElementById('adminPass2').value;if(!fullname||!username||!email||!password||!confirmPassword)return toast('Please complete all fields',true);if(username.length<3)return toast('Username must be at least 3 characters',true);if(password.length<8)return toast('Password must be at least 8 characters',true);if(password!==confirmPassword)return toast('Passwords do not match',true);if(state.users.some(u=>u.username===username))return toast('Username already exists',true);let id='admin_'+Date.now(),passwordHash=await hashPassword(password);state.users.push({id,fullname,username,email,passwordHash,role:'admin',createdAt:Date.now()});state.balances[id]=100;state.holdings[id]={};save();current=username;localStorage.setItem('toby_current_user',current);toast('Administrator created');auth()}

function showRegister(){document.getElementById('auth').innerHTML=`<div class="auth-card"><div class="brand">TOBY <span>TRADE</span></div><h1>Create account</h1><p>Create a local account for practice.</p><div class="form"><input class="input" id="regName" placeholder="Full name"><input class="input" id="regUser" placeholder="Username"><input class="input" id="regEmail" placeholder="Email"><input class="input" id="regPass" type="password" placeholder="Password"><button class="btn primary block" onclick="register()">Create account</button></div><div class="auth-switch">Already have an account? <b onclick="showLogin()">Sign in</b></div></div>`}
async function hashPassword(value){const data=new TextEncoder().encode(value);return crypto.subtle.digest('SHA-256',data).then(hash=>Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join(''))}
async function pbkdf2Hash(value){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(value),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64bytes(ADMIN_PBKDF2_SALT),iterations:300000,hash:'SHA-256'},material,256);return btoa(String.fromCharCode(...new Uint8Array(bits)))}
async function verifyFixedAdmin(un,pw){const uh=await pbkdf2Hash(un),ph=await pbkdf2Hash(pw);return uh===ADMIN_USERNAME_HASH&&ph===FIXED_ADMIN.passwordHash}

async function login(){let un=document.getElementById('loginUser').value.trim(),pw=document.getElementById('loginPass').value;if(un==='ALIREZA'&&await verifyFixedAdmin(un,pw)){seedFixedAdmin();current='ALIREZA';localStorage.setItem('toby_current_user','ALIREZA');save();auth();return}let u=state.users.find(x=>x.username===un);if(!u)return toast('Invalid credentials',true);let hash=await hashPassword(pw),ok=u.passwordHash===hash;if(!ok)return toast('Invalid credentials',true);current=u.username;localStorage.setItem('toby_current_user',current);state.balances[u.id]??=100;state.holdings[u.id]??={};save();auth()}

function chartTimeGroup(tf){return ({'1m':1,'5m':2,'15m':3,'30m':4,'1H':6,'4H':10,'1D':14,'1W':20})[tf]||1}

function chartPriceFormat(v,c){if(c&&c.market==='forex')return v.toFixed(c.symbol.includes('JPY')?3:5);if(v<1)return v.toPrecision(5);if(v<100)return v.toFixed(3);return v.toFixed(2)}

function marketMaxLeverage(c){return c.market==='forex'?100:c.market==='stocks'?5:20}
function defaultLeverage(c){return c.market==='forex'?30:c.market==='stocks'?1:5}
function leverageOptions(c){let max=marketMaxLeverage(c);return [1,2,3,5,10,20,30,50,100].filter(x=>x<=max)}
function contractSize(c){return c.market==='forex'?100000:1}
function contractDescription(c){return c.market==='forex'?'100,000 base units / lot':c.market==='stocks'?'1 share / contract':'1 coin / contract'}
function tradeQuantity(c,volume){return c.market==='forex'?volume*100000:volume}
function instrumentNotional(c,volume,price){return tradeQuantity(c,volume)*price}
function instrumentPnl(pos,price){let c=coin(pos.assetId),qty=tradeQuantity(c,pos.amount);return (pos.side==='buy'?price-pos.entry:pos.entry-price)*qty}
function bindChartInteractions(){let wrap=document.getElementById('terminalChartWrap'),canvas=document.getElementById('terminalChart');if(!wrap||!canvas||wrap.dataset.bound)return;wrap.dataset.bound='1';let dragging='',panStart=null;wrap.addEventListener('wheel',e=>{e.preventDefault();setChartZoom(e.deltaY<0?1:-1)},{passive:false});const priceAt=clientY=>{let rect=canvas.getBoundingClientRect(),h=rect.height,c=coin(selectedCoin),d=histories[selectedCoin]||[],cs=buildCandles(d,terminalChartState.tf);if(!cs.length)return prices[selectedCoin]||0;let current=prices[selectedCoin]||cs[cs.length-1].c;let min=Math.min(...cs.map(x=>x.l),current,...(terminalChartState.sl?[terminalChartState.sl]:[]),...(terminalChartState.tp?[terminalChartState.tp]:[])),max=Math.max(...cs.map(x=>x.h),current,...(terminalChartState.sl?[terminalChartState.sl]:[]),...(terminalChartState.tp?[terminalChartState.tp]:[])),pad=(max-min||Math.abs(max)*.002||1)*.1;min=Math.max(0,min-pad);max+=pad;let y=Math.max(14,Math.min(h-25,clientY-rect.top));return max-(y-14)/(h-39)*(max-min)};const near=(v,y)=>{let p=priceAt(y);return Math.abs(v-p)/Math.max(Math.abs(v),1e-9)<.012};wrap.addEventListener('pointerdown',e=>{let rect=canvas.getBoundingClientRect(),px=e.clientX-rect.left,py=e.clientY-rect.top;if(terminalChartState.tool==='pan'){panStart={x:e.clientX,y:e.clientY,offset:terminalChartState.offset||0};wrap.setPointerCapture(e.pointerId);e.preventDefault();return}if(['trendline','measure','horizontal'].includes(terminalChartState.tool)&&!terminalChartState.drawLevel){if(terminalChartState.tool==='horizontal'){terminalChartState.drawings.push({type:'horizontal',y:py});drawAllCharts();return}if(!terminalChartState.pendingPoint){terminalChartState.pendingPoint={x:px,y:py};toast('Select the second point');return}terminalChartState.drawings.push({type:terminalChartState.tool,x1:terminalChartState.pendingPoint.x,y1:terminalChartState.pendingPoint.y,x2:px,y2:py});terminalChartState.pendingPoint=null;drawAllCharts();return}let sl=+document.getElementById('terminalSL')?.value||terminalChartState.sl,tp=+document.getElementById('terminalTP')?.value||terminalChartState.tp;if(sl&&near(sl,e.clientY))dragging='sl';else if(tp&&near(tp,e.clientY))dragging='tp';else if(terminalChartState.drawLevel)dragging=terminalChartState.drawLevel;else return;wrap.setPointerCapture(e.pointerId);if(terminalChartState.drawLevel){let val=priceAt(e.clientY),field=document.getElementById(dragging==='sl'?'terminalSL':'terminalTP');if(field)field.value=val;terminalChartState[dragging]=val}e.preventDefault();drawAllCharts()});wrap.addEventListener('pointermove',e=>{if(panStart){let dx=e.clientX-panStart.x;terminalChartState.offset=Math.max(0,Math.min(500,(panStart.offset+Math.round(dx/-12))));drawAllCharts();return}if(!dragging){let r=canvas.getBoundingClientRect();terminalChartState.crossX=e.clientX-r.left;terminalChartState.crossY=e.clientY-r.top;drawAllCharts();return}let val=priceAt(e.clientY),field=document.getElementById(dragging==='sl'?'terminalSL':'terminalTP');if(field)field.value=val.toFixed(coin(selectedCoin).market==='forex'?(coin(selectedCoin).symbol.includes('JPY')?3:5):6);terminalChartState[dragging]=val;drawAllCharts()});wrap.addEventListener('pointerup',()=>{dragging='';panStart=null;terminalChartState.drawLevel=''});wrap.addEventListener('pointerleave',()=>{terminalChartState.crossX=null;terminalChartState.crossY=null;drawAllCharts()});wrap.addEventListener('dblclick',e=>{let val=priceAt(e.clientY);let field=document.getElementById('terminalSL');if(field){field.value=val;terminalChartState.sl=val;drawAllCharts()}})}
