const COINS=[
['btc','Bitcoin','BTC',60000,63000],['eth','Ethereum','ETH',3000,3300],['usdt','Tether','USDT',.99,1.01],['bnb','BNB','BNB',400,430],['sol','Solana','SOL',100,120],['xrp','XRP','XRP',.5,.6],['ada','Cardano','ADA',.35,.45],['doge','Dogecoin','DOGE',.07,.09],['dot','Polkadot','DOT',5,6],['trx','TRON','TRX',.08,.09],['ltc','Litecoin','LTC',80,90],['link','Chainlink','LINK',12,14],['uni','Uniswap','UNI',6,7],['avax','Avalanche','AVAX',30,35],['matic','Polygon','MATIC',.7,.9],['atom','Cosmos','ATOM',3,5],['near','NEAR Protocol','NEAR',2,6],['arb','Arbitrum','ARB',.35,.7],['op','Optimism','OP',.5,1.2],['shib','Shiba Inu','SHIB',.00001,.00002]

// The access key itself is never stored in localStorage or shown by the application.
const ACCESS_SECURITY={
  iterations:600000,
  salt:'xQj22KsqjO3mCx/xWzWQyA==',
  iv:'F1Rjv0fxVF/T1b8N',
  ciphertext:'RrJLEbE8rKSI0QhmJ4mU5sXciIN3XgNVxT8AxjD4oUn6XyGEKfEQqnvZeurK+qCJrPeNdKkh'

// Security migration: remove any legacy plaintext passwords from older demo data.
 let current=localStorage.getItem('toby_current_user')||null; let prices={}, histories={}, changes={}; let active='dashboard', selectedCoin='btc', tradeSide='buy';
function load(){try{return JSON.parse(localStorage.getItem(DBKEY))||structuredClone(defaultState)}catch{return structuredClone(defaultState)}}

function irr(n){return money(n)+' IRR'}
function coin(id){return COINS.find(c=>c.id===id)}
function initPrices(){COINS.forEach(c=>{let r=state.ranges[c.id]||{min:c.min,max:c.max};let p=prices[c.id]??(r.min+r.max)/2;prices[c.id]=p;histories[c.id]=histories[c.id]||Array.from({length:28},()=>p*(.96+Math.random()*.08));changes[c.id]=changes[c.id]??0})}
function tick(){COINS.forEach(c=>{let r=state.ranges[c.id]||{min:c.min,max:c.max};let p=prices[c.id];let next=Math.min(r.max,Math.max(r.min,p*(1+(Math.random()-.49)*.012)));changes[c.id]=(next-p)/p*100;prices[c.id]=next;histories[c.id].push(next);if(histories[c.id].length>40)histories[c.id].shift()}); if(current && active!=='admin')renderContent(false)}

function go(v){active=v;document.body.classList.remove('terminal-mode');closeDrawer();renderShell();document.getElementById('pageTitle').textContent=navItems().find(x=>x[0]===v)?.[2]||'TOBY TRADE';renderContent(true);window.scrollTo({top:0,behavior:'smooth'})}
function renderContent(redraw=true){let el=document.getElementById('content');let html=active==='dashboard'?dashboard():active==='markets'?markets():active==='wallet'?wallet():active==='orders'?orders():active==='news'?news():active==='settings'?settings():active==='terminal'?terminal():active==='detail'?detail():admin();el.innerHTML=html;if(active==='admin')adminTab(atab);setTimeout(drawAllCharts,0)}
function dashboard(){let u=user(),bal=state.balances[u.id]||0,pv=portfolio(),pos=Object.values(state.holdings[u.id]||{}).filter(x=>x.amount>0).length;return `<div class="demo">Demo simulation is active — prices move every few seconds and no real trades are executed.</div><section class="hero"><div class="hero-card"><div class="muted">TOBY TRADE</div><h1>Trade with clarity.</h1><p>A minimal dashboard for market practice, portfolio management, and testing buy/sell strategies. Everything is stored locally in your browser.</p><div class="hero-actions"><button class="btn primary" onclick="go('markets')">View markets</button><button class="btn" onclick="openDeposit()">+ Demo funds</button></div></div><div class="stats"><div class="stat"><small>Cash balance</small><strong class="num">${irr(bal)}</strong></div><div class="stat"><small>Asset value</small><strong class="num">${irr(pv)}</strong></div><div class="stat"><small>Open positions</small><strong class="num">${pos}</strong></div></div></section><div class="section-head"><h2>Popular markets</h2><button class="btn" onclick="go('markets')">All markets</button></div><div class="grid">${COINS.slice(0,8).map(card).join('')}</div>`}
function card(c){let p=prices[c.id],ch=changes[c.id]||0,owned=(state.holdings[user().id]||{})[c.id]?.amount||0;return `<article class="market-card"><div class="coin-head"><div><div class="coin-name">${c.name}</div><div class="symbol">${c.symbol}</div></div>${owned?`<span class="symbol">${money(owned)} owned</span>`:''}</div><div class="price num">$${money(p)}</div><div class="change ${ch>=0?'up':'down'}">${ch>=0?'+':''}${ch.toFixed(2)}%</div><canvas class="spark" data-chart="${c.id}"></canvas><div class="card-actions"><button class="btn up" onclick="openTrade('${c.id}','buy')">Buy</button><button class="btn" onclick="openTrade('${c.id}','sell')" ${owned?'':'disabled'}>Sell</button><button class="btn" onclick="showCoin('${c.id}')">Details</button></div></article>`}
function markets(){return `<div class="toolbar"><div><h2 style="margin:0 0 5px">Markets</h2><span class="muted">${COINS.length} simulated assets</span></div><div class="search"><input class="input" id="marketSearch" placeholder="Search by name or symbol..." oninput="filterMarkets(this.value)"></div></div><div class="grid" id="marketGrid">${COINS.map(card).join('')}</div>`}
function filterMarkets(q){q=q.toLowerCase();document.querySelectorAll('#marketGrid .market-card').forEach((el,i)=>{let c=COINS[i];el.style.display=(c.name.toLowerCase().includes(q)||c.symbol.toLowerCase().includes(q))?'':'none'})}
function showCoin(id){selectedCoin=id;tradeSide='buy';active='terminal';document.body.classList.add('terminal-mode');renderContent();}
function terminal(){let c=coin(selectedCoin),p=prices[c.id]||0,ch=changes[c.id]||0,u=user(),h=(state.holdings[u.id]||{})[c.id],owned=h?.amount||0;return `<div class="terminal"><div class="terminal-head"><div class="terminal-left"><button class="icon-btn terminal-icon" onclick="exitTerminal()" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18 9 12l6-6"/></svg></button><div><div class="terminal-symbol">${c.symbol}/USD</div><div class="terminal-market">${c.name} · Simulated Market</div></div><div class="terminal-price num">$${money(p)}</div><div class="${ch>=0?'up':'down'} terminal-market">${ch>=0?'+':''}${ch.toFixed(2)}%</div></div><div class="terminal-right"><button class="btn terminal-btn" onclick="openDeposit()">Add funds</button><button class="icon-btn terminal-icon" onclick="toggleTheme()" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></div><div class="terminal-body"><aside class="terminal-tools"><button class="tool-btn active" title="Crosshair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button><button class="tool-btn" title="Line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19 19 5"/></svg></button><button class="tool-btn" title="Measure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 17 17 4M7 4l13 13"/></svg></button></aside><section class="chart-stage"><div class="chart-toolbar"><button class="tf active">1m</button><button class="tf">5m</button><button class="tf">15m</button><button class="tf">1H</button><button class="tf">4H</button><button class="tf">1D</button><span style="width:1px;height:20px;background:var(--border);margin:0 5px"></span><button class="tf">Candles</button><button class="tf">Indicators</button><button class="tf">Compare</button></div><div class="chart-wrap"><canvas id="terminalChart" class="terminal-chart"></canvas><div class="chart-overlay"><span class="chart-label">${c.symbol} · Price</span></div></div></section><aside class="order-panel"><div class="order-panel-head"><div><b>Order</b><div class="terminal-market">${c.symbol}/USD</div></div><span class="terminal-market">Market</span></div><div class="order-panel-body"><div class="trade-switch"><button class="${tradeSide==='buy'?'active buy':''}" onclick="setTerminalSide('buy')">Buy</button><button class="${tradeSide==='sell'?'active sell':''}" onclick="setTerminalSide('sell')">Sell</button></div><div class="terminal-stat"><span>Available balance</span><b class="num">${irr(state.balances[u.id]||0)}</b></div><div class="terminal-stat"><span>Position</span><b class="num">${money(owned)} ${c.symbol}</b></div><div class="terminal-stat"><span>Unrealized P&amp;L</span><b class="num ${h&&owned>0?((p-h.avg)*owned>=0?'up':'down'):''}">${h&&owned>0?((p-h.avg)*owned>=0?'+':'')+money((p-h.avg)*owned):'$0.00'}</b></div><div class="terminal-stat"><span>P&amp;L %</span><b class="num ${h&&owned>0?((p-h.avg)>=0?'up':'down'):''}">${h&&owned>0?((p-h.avg)>=0?'+':'')+(((p-h.avg)/h.avg)*100).toFixed(2)+'%':'0.00%'}</b></div><div class="terminal-stat"><span>Entry price</span><b class="num">${h&&owned>0?'$'+money(h.avg):'$0.00'}</b></div><div class="terminal-stat"><span>Market price</span><b class="num">$${money(p)}</b></div><div class="terminal-order"><label>Amount (${c.symbol})<input class="input" id="terminalAmount" type="number" min="0" step="any" placeholder="0" oninput="calcTerminalOrder()"></label><div class="terminal-stat"><span>Estimated value</span><b id="terminalTotal" class="num">$0</b></div><div class="terminal-actions"><button class="btn ${tradeSide==='buy'?'primary':'danger'}" onclick="executeTerminalTrade()">${tradeSide==='buy'?'Buy':'Sell'} ${c.symbol}</button><button class="btn" onclick="openTrade('${c.id}','${tradeSide}')">Advanced</button></div></div><div style="margin-top:18px" class="terminal-market">Orders are simulated. Prices update automatically.</div></div></aside></div><div class="terminal-footer"><span class="terminal-back" onclick="exitTerminal()">Back to markets</span><span>Market</span><span>USD</span><span>Simulated data</span><span style="margin-left:auto">TOBY TRADE</span></div></div>`}
function exitTerminal(){active='markets';document.body.classList.remove('terminal-mode');renderShell();document.getElementById('pageTitle').textContent='Markets';renderContent();}
function setTerminalSide(side){tradeSide=side;renderContent();}
function calcTerminalOrder(){let a=+document.getElementById('terminalAmount')?.value||0,p=prices[selectedCoin]||0;let e=document.getElementById('terminalTotal');if(e)e.textContent='$'+money(a*p)}
function executeTerminalTrade(){let a=+document.getElementById('terminalAmount')?.value||0;if(!(a>0))return toast('Enter an amount',true);let id=selectedCoin,c=coin(id),p=prices[id],u=user(),h=(state.holdings[u.id]||{})[id],owned=h?.amount||0,total=a*p;if(tradeSide==='buy'&&(state.balances[u.id]||0)<total)return toast('Insufficient balance',true);if(tradeSide==='sell'&&owned<a)return toast('Insufficient holdings',true);state.holdings[u.id]=state.holdings[u.id]||{};if(tradeSide==='buy'){let old=state.holdings[u.id][id]||{amount:0,avg:0};old.avg=(old.amount*old.avg+total)/(old.amount+a);old.amount+=a;state.holdings[u.id][id]=old;state.balances[u.id]-=total}else{let old=state.holdings[u.id][id];old.amount-=a;if(old.amount<=1e-12)delete state.holdings[u.id][id];state.balances[u.id]+=total}state.orders.push({time:Date.now(),userId:u.id,username:u.username,side:tradeSide,coinId:id,amount:a,price:p,total});state.transactions.push({time:Date.now(),userId:u.id,type:tradeSide,coinId:id,amount:a,total});save();toast(`${tradeSide==='buy'?'Buy':'Sell'} ${c.symbol} completed`);renderShell();renderContent();}
function detail(){let c=coin(selectedCoin),p=prices[c.id],ch=changes[c.id]||0;return `<div class="detail"><div class="panel chart-box"><div class="coin-head"><div><h2 style="margin:0">${c.name} <span class="muted">${c.symbol}</span></h2><div class="price num">$${money(p)}</div></div><div class="${ch>=0?'up':'down'}">${ch>=0?'+':''}${ch.toFixed(2)}%</div></div><canvas id="bigChart" class="big-chart"></canvas></div><div class="panel trade-box"><div class="tabs"><button class="${tradeSide==='buy'?'active':''}" onclick="openTrade('${c.id}','buy')">Buy</button><button class="${tradeSide==='sell'?'active':''}" onclick="openTrade('${c.id}','sell')">Sell</button></div><p class="muted">Simulated live price</p><div class="trade-total num">$${money(p)}</div><div class="info-row"><span>Cash balance</span><b>${irr(state.balances[user().id]||0)}</b></div><div class="info-row"><span>Position</span><b>${money((state.holdings[user().id]||{})[c.id]?.amount||0)} ${c.symbol}</b></div><button class="btn ${tradeSide==='buy'?'primary':'danger'} block" onclick="openTrade('${c.id}','${tradeSide}')">${tradeSide==='buy'?'Buy '+c.symbol:'Sell '+c.symbol}</button></div></div>`}
function wallet(){let u=user(),bal=state.balances[u.id]||0,h=state.holdings[u.id]||{};let rows=COINS.filter(c=>h[c.id]?.amount>0).map(c=>{let x=h[c.id],v=x.amount*prices[c.id],pl=(prices[c.id]-x.avg)*x.amount;return `<tr><td>${c.name} <span class="muted">${c.symbol}</span></td><td class="num">${money(x.amount)}</td><td class="num">$${money(x.avg)}</td><td class="num">$${money(prices[c.id])}</td><td class="num">$${money(v)}</td><td class="num ${pl>=0?'up':'down'}">${pl>=0?'+':''}$${money(pl)}</td></tr>`}).join('');return `<div class="stats" style="margin-bottom:15px"><div class="stat"><small>balance</small><strong class="num">${irr(bal)}</strong></div><div class="stat"><small>Value portfolio</small><strong class="num">${irr(portfolio())}</strong></div><div class="stat"><small>Total balance</small><strong class="num">${irr(bal+portfolio())}</strong></div></div><div class="panel"><div class="section-head" style="margin-top:0"><h2>Assets</h2><button class="btn" onclick="openDeposit()">+ Add demo funds</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Asset</th><th>Amount</th><th>Average entry</th><th>Price</th><th>Value</th><th>P/L</th></tr></thead><tbody>${rows||`<tr><td colspan="6" class="empty">No holdings yet.</td></tr>`}</tbody></table></div></div>`}
function orders(){let u=user(),arr=state.orders.filter(o=>u.role==='admin'||o.userId===u.id).slice().reverse();return `<div class="panel"><div class="section-head" style="margin-top:0"><h2>${u.role==='admin'?'All orders':'Order history'}</h2>${u.role==='admin'?'<button class="btn danger" onclick="clearOrders()">Clear</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th>${u.role==='admin'?'<th>User</th>':''}<th>Type</th><th>Asset</th><th>Amount</th><th>Price</th><th>Total</th></tr></thead><tbody>${arr.map(o=>`<tr><td>${new Date(o.time).toLocaleString('fa-IR')}</td>${u.role==='admin'?`<td>Hidden</td>`:''}<td class="${o.side==='buy'?'up':'down'}">${o.side==='buy'?'Buy':'Sell'}</td><td>${coin(o.coinId).symbol}</td><td class="num">${money(o.amount)}</td><td class="num">$${money(o.price)}</td><td class="num">$${irr(o.total)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No orders yet.</td></tr>'}</tbody></table></div></div>`}
function news(){return `<div class="news-grid"><article class="news-card"><span class="muted">DEMO EDITORIAL</span><h3>How does a disciplined trader think?</h3><p>Before entering, define the entry, risk limit, and position size. Emotion should not replace the plan.</p></article><article class="news-card"><span class="muted">MARKET NOTE</span><h3>Price volatility is part of the game</h3><p>Prices in this version are simulated; it is designed to practice risk management and observe portfolio behavior.</p></article><article class="news-card"><span class="muted">RISK</span><h3>Protect capital first</h3><p>In real trading, returns are never guaranteed. This environment is for learning and interface testing only.</p></article></div>`}
function settings(){let u=user();return `<div class="settings-grid"><div class="panel"><h2>Profile</h2><div class="form"><label>Full name<input class="input" id="setName" value="${esc(u.fullname)}"></label><label>Email<input class="input" id="setEmail" value="${esc(u.email)}"></label><label>New password<input class="input" id="setPass" type="password" placeholder="Optional"></label><button class="btn primary" onclick="saveProfile()">Save</button></div></div><div class="panel"><h2>Appearance</h2><div class="theme-cards"><button class="theme-card ${theme()==='dark'?'active':''}" onclick="setTheme('dark')">Dark<br><small>Dark</small></button><button class="theme-card ${theme()==='light'?'active':''}" onclick="setTheme('light')">Light<br><small>Light</small></button></div><h3>About this demo</h3><p class="muted" style="line-height:1.8">Authentication, balances, and trades are stored only in localStorage. Real money, payments, account security, and a database require a secure backend.</p></div></div>`}
function admin(){if(user()?.role!=='admin')return '<div class="panel">Access denied</div>';let users=state.users.map(x=>`<tr><td>${esc(x.fullname)}</td><td>Hidden</td><td>Hidden</td><td>${x.role}</td><td class="num">${irr(state.balances[x.id]||0)}</td></tr>`).join('');return `<div class="admin-tabs"><button class="btn primary" onclick="adminTab('prices')">Prices</button><button class="btn" onclick="adminTab('users')">Users</button><button class="btn" onclick="adminTab('orders')">Orders</button><button class="btn danger" onclick="resetData()">Reset demo</button></div><div id="adminArea"></div>`}
let atab='prices';function adminTab(t){atab=t;let area=document.getElementById('adminArea');if(!area){renderContent();setTimeout(()=>adminTab(t),0);return}if(t==='users'){area.innerHTML=`<div class="panel table-wrap"><table class="table"><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Balance</th></tr></thead><tbody>${state.users.map(x=>`<tr><td>${esc(x.fullname)}</td><td>Hidden</td><td>Hidden</td><td>${x.role}</td><td>${irr(state.balances[x.id]||0)}</td></tr>`).join('')}</tbody></table></div>`}else if(t==='orders'){area.innerHTML=`<div class="panel table-wrap"><table class="table"><thead><tr><th>User</th><th>Type</th><th>Asset</th><th>Amount</th><th>Total</th></tr></thead><tbody>${state.orders.slice().reverse().map(o=>`<tr><td>Hidden</td><td>${o.side}</td><td>${coin(o.coinId).symbol}</td><td>${money(o.amount)}</td><td>${irr(o.total)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Empty</td></tr>'}</tbody></table></div>`}else{area.innerHTML=`<div class="panel table-wrap"><table class="table"><thead><tr><th>Asset</th><th>symbol</th><th>Min</th><th>Max</th><th>Save</th></tr></thead><tbody>${COINS.map(c=>{let r=state.ranges[c.id];return `<tr><td>${c.name}</td><td>${c.symbol}</td><td><input class="input" style="min-width:100px" id="min_${c.id}" value="${r.min}"></td><td><input class="input" style="min-width:100px" id="max_${c.id}" value="${r.max}"></td><td><button class="btn" onclick="saveRange('${c.id}')">Save</button></td></tr>`}).join('')}</tbody></table></div>`}}
function saveRange(id){let min=+document.getElementById('min_'+id).value,max=+document.getElementById('max_'+id).value;if(!(min>0&&max>min))return toast('Invalid price range',true);state.ranges[id]={min,max};prices[id]=Math.min(max,Math.max(min,prices[id]));save();toast('Range saved')}
function clearOrders(){if(confirm('Delete all orders?')){state.orders=[];save();renderContent()}}
async function saveProfile(){let u=user();u.fullname=document.getElementById('setName').value.trim()||u.fullname;u.email=document.getElementById('setEmail').value.trim()||u.email;let p=document.getElementById('setPass').value;if(p)u.passwordHash=await hashPassword(p);delete u.password;save();toast('Profile saved');renderContent()}
function openDeposit(){modal(`<h2>Add demo funds</h2><p class="muted">This amount is virtual and for practice only.</p><div class="form"><input class="input" id="deposit" type="number" min="1" placeholder="e.g. 1000"><button class="btn primary" onclick="deposit()">Add</button></div>`)}
function deposit(){let n=+document.getElementById('deposit').value;if(!(n>0))return toast('Invalid amount',true);let u=user();state.balances[u.id]=(state.balances[u.id]||0)+n;state.transactions.push({type:'deposit',userId:u.id,amount:n,time:Date.now()});save();closeModal();toast('Demo funds added');renderShell();renderContent()}
function openTrade(id,side){selectedCoin=id;tradeSide=side;let c=coin(id),p=prices[id],h=(state.holdings[user().id]||{})[id];modal(`<h2>${side==='buy'?'Buy':'Sell'} ${c.symbol}</h2><p class="muted">Current price: <b class="num">$${money(p)}</b></p><div class="form"><label>Amount ${c.symbol}<input class="input" id="tradeAmount" type="number" min="0" step="any" placeholder="0" oninput="calcTrade()"></label><div class="info-row"><span>Available ${side==='buy'?'Balance':'Holdings'}</span><b class="num">${side==='buy'?irr(state.balances[user().id]||0):money(h?.amount||0)+' '+c.symbol}</b></div><div class="info-row"><span>Order value</span><b id="tradeTotal" class="num">0 IRR</b></div><button class="btn ${side==='buy'?'primary':'danger'} block" onclick="executeTrade()">Confirm ${side==='buy'?'Buy':'Sell'}</button></div>`)}
function calcTrade(){let a=+document.getElementById('tradeAmount').value||0;document.getElementById('tradeTotal').textContent=irr(a*prices[selectedCoin])}
function executeTrade(){let u=user(),id=selectedCoin,c=coin(id),p=prices[id],a=+document.getElementById('tradeAmount').value||0;if(!(a>0))return toast('Enter an amount',true);let total=a*p;let h=state.holdings[u.id]||{};state.holdings[u.id]=h;if(tradeSide==='buy'){if((state.balances[u.id]||0)<total)return toast('Insufficient balance',true);state.balances[u.id]-=total;let old=h[id]||{amount:0,avg:0};old.avg=(old.amount*old.avg+total)/(old.amount+a);old.amount+=a;h[id]=old}else{let old=h[id];if(!old||old.amount<a)return toast('Insufficient holdings',true);old.amount-=a;if(old.amount<=1e-12)delete h[id];state.balances[u.id]=(state.balances[u.id]||0)+total}state.orders.push({time:Date.now(),userId:u.id,username:u.username,side:tradeSide,coinId:id,amount:a,price:p,total});state.transactions.push({time:Date.now(),userId:u.id,type:tradeSide,coinId:id,amount:a,total});save();closeModal();toast(`${tradeSide==='buy'?'Buy':'Sell'} ${c.symbol} completed`);renderShell();renderContent()}
function modal(body){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><span></span><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>${body}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function toast(msg,error=false){let t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(error?' error':'');clearTimeout(window._toast);window._toast=setTimeout(()=>t.className='toast',2200)}
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('open')}
function theme(){return localStorage.getItem('toby_theme')||state.settings.theme||'dark'}function setTheme(t){localStorage.setItem('toby_theme',t);state.settings.theme=t;save();document.documentElement.dataset.theme=t;renderShell();renderContent()}function toggleTheme(){setTheme(theme()==='dark'?'light':'dark')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function hasAdmin(){return state.users.some(u=>u.role==='admin')}
async function migrateLegacyPasswords(){let changed=false;for(const u of state.users){if(u.password&&!u.passwordHash){u.passwordHash=await hashPassword(u.password);delete u.password;changed=true}}if(changed)save()}
function gateUnlocked(){return sessionStorage.getItem('toby_gate_unlocked')==='1'}
function b64bytes(v){return Uint8Array.from(atob(v),c=>c.charCodeAt(0))}
async function verifyAccessKey(key){
  if(!key||key.length<12)return false;
  try{
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(key),'PBKDF2',false,['deriveKey']);
    const aes=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(ACCESS_SECURITY.salt),iterations:ACCESS_SECURITY.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(ACCESS_SECURITY.iv)},aes,b64bytes(ACCESS_SECURITY.ciphertext));
    const data=JSON.parse(new TextDecoder().decode(plain));
    return data?.app==='TOBY TRADE'&&data?.gate==='verified';
  }catch{return false}
}
function lockGate(){sessionStorage.removeItem('toby_gate_unlocked');current=null;localStorage.removeItem('toby_current_user');active='dashboard';auth()}
function showAccessGate(){document.getElementById('auth').innerHTML=`<div class="auth-card"><div class="brand">TOBY <span>TRADE</span></div><h1>Secure access.</h1><p>This deployment is protected by a private access key. The administrator setup is locked until the key is verified.</p><div class="form"><input class="input" id="accessKey" type="password" autocomplete="off" placeholder="Private access key" onkeydown="if(event.key==='Enter')unlockGate()"><button class="btn primary block" onclick="unlockGate()">Unlock deployment</button></div><p style="font-size:12px;margin-top:20px">The key is verified locally and is never saved in browser storage or displayed.</p></div>`}
async function unlockGate(){const key=document.getElementById('accessKey')?.value||'';if(!(await verifyAccessKey(key)))return toast('Access key rejected',true);sessionStorage.setItem('toby_gate_unlocked','1');toast('Deployment unlocked');auth()}
function auth(){
  if(!gateUnlocked()){document.getElementById('auth').style.display='grid';document.getElementById('app').style.display='none';showAccessGate();return}
  let activeUser=user();
  if(current&&activeUser){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';renderShell();renderContent()}
  else{current=null;localStorage.removeItem('toby_current_user');document.getElementById('auth').style.display='grid';document.getElementById('app').style.display='none';if(!hasAdmin())showAdminSetup();else showLogin()}
}
function showAdminSetup(){document.getElementById('auth').innerHTML=`<div class="auth-card"><div class="brand">TOBY <span>TRADE</span></div><h1>Set up administrator.</h1><p>Access has been verified. Now create the first administrator account.</p><div class="form"><input class="input" id="adminName" placeholder="Full name"><input class="input" id="adminUser" placeholder="Admin username"><input class="input" id="adminEmail" placeholder="Admin email"><input class="input" id="adminPass" type="password" placeholder="Password"><input class="input" id="adminPass2" type="password" placeholder="Confirm password" onkeydown="if(event.key==='Enter')createAdmin()"><button class="btn primary block" onclick="createAdmin()">Create administrator</button></div><p style="font-size:12px;margin-top:20px">Credentials are never displayed. The access key and administrator password are separate security layers.</p></div>`}
async function createAdmin(){if(!gateUnlocked())return showAccessGate();if(hasAdmin())return auth();let fullname=document.getElementById('adminName').value.trim(),username=document.getElementById('adminUser').value.trim(),email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPass').value,confirmPassword=document.getElementById('adminPass2').value;if(!fullname||!username||!email||!password||!confirmPassword)return toast('Please complete all fields',true);if(username.length<3)return toast('Username must be at least 3 characters',true);if(password.length<8)return toast('Password must be at least 8 characters',true);if(password!==confirmPassword)return toast('Passwords do not match',true);if(state.users.some(u=>u.username===username))return toast('Username already exists',true);let id='admin_'+Date.now(),passwordHash=await hashPassword(password);state.users.push({id,fullname,username,email,passwordHash,role:'admin',createdAt:Date.now()});state.balances[id]=10000;state.holdings[id]={};save();current=username;localStorage.setItem('toby_current_user',current);toast('Administrator created');auth()}
function showLogin(){document.getElementById('auth').innerHTML=`<div class="auth-card"><div class="brand">TOBY <span>TRADE</span></div><h1>Welcome back.</h1><p>Enter the trading simulator.</p><div class="form"><input class="input" id="loginUser" placeholder="Username"><input class="input" id="loginPass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"><button class="btn primary block" onclick="login()">Sign in</button></div><div class="auth-switch">New here? <b onclick="showRegister()">Create account</b></div><p style="font-size:12px;margin-top:20px">For security, account credentials are never displayed here.</p></div>`}
function showRegister(){document.getElementById('auth').innerHTML=`<div class="auth-card"><div class="brand">TOBY <span>TRADE</span></div><h1>Create account</h1><p>Create a local account for practice.</p><div class="form"><input class="input" id="regName" placeholder="Full name"><input class="input" id="regUser" placeholder="Username"><input class="input" id="regEmail" placeholder="Email"><input class="input" id="regPass" type="password" placeholder="Password"><button class="btn primary block" onclick="register()">Create account</button></div><div class="auth-switch">Already have an account? <b onclick="showLogin()">Sign in</b></div></div>`}
async function hashPassword(value){const data=new TextEncoder().encode(value);const hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('')}

async function login(){let un=document.getElementById('loginUser').value.trim(),pw=document.getElementById('loginPass').value,u=state.users.find(x=>x.username===un);if(!u)return toast('Invalid credentials',true);let hash=await hashPassword(pw),ok=u.passwordHash===hash;if(!ok)return toast('Invalid credentials',true);current=u.username;localStorage.setItem('toby_current_user',current);state.balances[u.id]??=10000;state.holdings[u.id]??={};save();auth()}
async function register(){if(!hasAdmin())return showAdminSetup();let fullname=document.getElementById('regName').value.trim(),username=document.getElementById('regUser').value.trim(),email=document.getElementById('regEmail').value.trim(),password=document.getElementById('regPass').value;if(!fullname||!username||!email||!password)return toast('Please complete all fields',true);if(state.users.some(u=>u.username===username))return toast('Username already exists',true);let id='u_'+Date.now(),passwordHash=await hashPassword(password);state.users.push({id,fullname,username,email,passwordHash,role:'user',createdAt:Date.now()});state.balances[id]=10000;state.holdings[id]={};save();current=username;localStorage.setItem('toby_current_user',current);auth()}
function logout(){current=null;localStorage.removeItem('toby_current_user');active='dashboard';auth()}
function drawCanvas(canvas,data,colorMode='auto',width=600,height=180){if(!canvas)return;let dpr=devicePixelRatio||1,rect=canvas.getBoundingClientRect(),w=Math.max(10,rect.width),h=Math.max(10,rect.height||height);canvas.width=w*dpr;canvas.height=h*dpr;let ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);let min=Math.min(...data),max=Math.max(...data),range=max-min||1;ctx.lineWidth=2;ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--text');ctx.beginPath();data.forEach((v,i)=>{let x=i/(data.length-1)*w,y=h-8-(v-min)/range*(h-16);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function drawTerminalChart(canvas,data){if(!canvas)return;let rect=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1,w=Math.max(10,rect.width),h=Math.max(10,rect.height);canvas.width=w*dpr;canvas.height=h*dpr;let ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);let styles=getComputedStyle(document.documentElement),grid=styles.getPropertyValue('--border'),text=styles.getPropertyValue('--muted'),up=styles.getPropertyValue('--up'),down=styles.getPropertyValue('--down');ctx.strokeStyle=grid;ctx.lineWidth=1;for(let i=1;i<8;i++){let y=i*h/8;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(let i=1;i<12;i++){let x=i*w/12;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}if(!data.length)return;let min=Math.min(...data),max=Math.max(...data),range=max-min||1,trend=data[data.length-1]>=data[0],lineColor=trend?up:down;ctx.strokeStyle=lineColor;ctx.lineWidth=2;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();data.forEach((v,i)=>{let x=i/(data.length-1||1)*w,y=h-22-(v-min)/range*(h-44);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();let last=data[data.length-1],lx=w,ly=h-22-(last-min)/range*(h-44);ctx.fillStyle=lineColor;ctx.beginPath();ctx.arc(lx,ly,3.5,0,Math.PI*2);ctx.fill();ctx.fillStyle=text;ctx.font='11px -apple-system, sans-serif';for(let i=0;i<5;i++){let val=max-(range*i/4);ctx.fillText('$'+money(val),w-62,14+i*(h-28)/4)}}
function drawAllCharts(){document.querySelectorAll('[data-chart]').forEach(c=>drawCanvas(c,histories[c.dataset.chart]||[]));let b=document.getElementById('bigChart');if(b)drawCanvas(b,histories[selectedCoin]||[], 'auto',800,300);let t=document.getElementById('terminalChart');if(t)drawTerminalChart(t,histories[selectedCoin]||[])}
async function init(){document.documentElement.dataset.theme=theme();await migrateLegacyPasswords();initPrices();auth();if(active==='detail')renderContent();setInterval(tick,3000);window.addEventListener('resize',drawAllCharts)}
init();
